  <rect width="100%" height="100%" filter="url(#knots)" opacity="0.55"/>
  <rect width="100%" height="100%" filter="url(#dark)" opacity="0.7"/>
  <rect width="100%" height="100%" filter="url(#light)" opacity="0.2"/>
