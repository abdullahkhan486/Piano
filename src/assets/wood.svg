<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380">
  <defs>
    <filter id="dark" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.14" numOctaves="5" seed="14" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.02  0 0 0 0 0.005  2.6 0 0 0 -1.05"/>
    </filter>
    <filter id="light" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.31" numOctaves="3" seed="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.96  0 0 0 0 0.66  0 0 0 0 0.36  1.7 0 0 0 -0.98"/>
    </filter>
    <filter id="knots" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0015 0.02" numOctaves="2" seed="29" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.01  0 0 0 0 0  1.8 0 0 0 -0.7"/>
