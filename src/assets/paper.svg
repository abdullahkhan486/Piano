<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.7" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0 0.12  0.9 0 0 0 -0.38"/>
    </filter>
    <filter id="blotch" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="21" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55  0 0 0 0 0.38  0 0 0 0 0.16  1.2 0 0 0 -0.46"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#blotch)" opacity="0.35"/>
  <rect width="100%" height="100%" filter="url(#fibre)" opacity="0.38"/>
</svg>
